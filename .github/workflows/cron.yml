name: Reminder Cron

on:
  schedule:
    # Tiap 10 menit. GitHub Actions cron timezone = UTC tapi nggak ngaruh
    # karena endpoint kita yg ngatur jam user pakai tzOffsetMinutes dari schedule.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/tick
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing DEPLOY_URL or CRON_SECRET secret"
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_URL/api/tick" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 25 \
            -d '{}' | head -c 500
          echo
